name: Native tvOS build
on:
  push:
    paths:
      - 'tvos/**'
      - 'ios/RigatoniStream/Core.swift'
      - 'ios/RigatoniStream/Library.swift'
      - 'ios/RigatoniStream/Discovery.swift'
      - 'ios/RigatoniStream/Series.swift'
      - 'ios/RigatoniStream/EPG.swift'
      - 'ios/RigatoniStream/Saved.swift'
      - 'ios/VLCKit.podspec'
      - 'ios/configure_http.py'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tvos
      - name: Generate Apple TV project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 ../ios/configure_http.py --host provider.example.invalid
      - name: Install native player
        run: |
          bundle exec ruby -rxcodeproj -e 'p = Xcodeproj::Project.open("RigatoniStreamTV.xcodeproj"); p.files.select { |f| f.path.end_with?("EPG.swift") || f.path.end_with?("Saved.swift") || %w[TVGuideView.swift TVFavorites.swift TVSavedView.swift TVHeroBanner.swift].include?(f.path) }.each(&:remove_from_project); p.save'
          bundle exec ruby update_project.rb
          bundle exec ruby update_project.rb
          bundle exec ruby -rxcodeproj -e 'p = Xcodeproj::Project.open("RigatoniStreamTV.xcodeproj"); t = p.targets.find { |x| x.name == "RigatoniStreamTV" }; t.build_configurations.each { |x| i = Xcodeproj::Plist.read_from_path(x.build_settings["INFOPLIST_FILE"]); abort "HTTP setting lost" unless i.dig("NSAppTransportSecurity", "NSExceptionDomains", "provider.example.invalid"); abort "Branding missing" unless i["CFBundleDisplayName"] == "Ant Streams" }; %w[TVShowsView.swift TVLastWatched.swift TVHistoryRail.swift Discovery.swift Series.swift EPG.swift Saved.swift TVGuideView.swift TVFavorites.swift TVSavedView.swift TVHeroBanner.swift].each { |name| abort "Source missing or duplicated" unless t.source_build_phase.files_references.count { |x| x.path.end_with?(name) } == 1 }; abort "Assets missing or duplicated" unless t.resources_build_phase.files_references.count { |x| x.path.end_with?("Assets.xcassets") } == 1'
          bundle exec pod install
      - name: Compile Apple TV simulator
        run: |
          set -o pipefail
          xcodebuild build -workspace RigatoniStreamTV.xcworkspace -scheme RigatoniStreamTV -destination 'generic/platform=tvOS Simulator' -derivedDataPath .build CODE_SIGNING_ALLOWED=NO | tee compile.log
      - name: Compile physical Apple TV
        run: |
          set -o pipefail
          xcodebuild build -workspace RigatoniStreamTV.xcworkspace -scheme RigatoniStreamTV -destination 'generic/platform=tvOS' -derivedDataPath .build-device CODE_SIGNING_ALLOWED=NO | tee device-build.log
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-build-reports
          path: |
            tvos/compile.log
            tvos/device-build.log
            tvos/Podfile.lock
