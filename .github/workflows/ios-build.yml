name: Native iOS build
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 test_http_config.py
          python3 configure_http.py
      - name: Install native player
        run: |
          bundle exec ruby -rxcodeproj -e 'p = Xcodeproj::Project.open("RigatoniStream.xcodeproj"); p.files.select { |f| %w[EPG.swift Saved.swift MobileExperience.swift DirectProviders.swift ProviderManagement.swift DirectPlayback.swift].include?(f.path) }.each(&:remove_from_project); p.save'
          bundle exec ruby update_project.rb
          bundle exec ruby update_project.rb
          bundle exec ruby -rxcodeproj -e 'p = Xcodeproj::Project.open("RigatoniStream.xcodeproj"); t = p.targets.find { |x| x.name == "RigatoniStream" }; t.build_configurations.each { |x| i = Xcodeproj::Plist.read_from_path(x.build_settings["INFOPLIST_FILE"]); abort "HTTP setting lost" unless i.dig("NSAppTransportSecurity", "NSAllowsArbitraryLoads") == true; abort "Audio background mode missing" unless i["UIBackgroundModes"].include?("audio") }; %w[EPG.swift Saved.swift MobileExperience.swift DirectProviders.swift ProviderManagement.swift DirectPlayback.swift].each { |name| abort "New source missing or duplicated" unless t.source_build_phase.files_references.count { |x| x.path == name } == 1 }; abort "PiP source duplicated" unless t.source_build_phase.files_references.count { |x| x.path == "PictureInPictureBridge.m" } == 1'
          bundle exec pod install
      - name: Compile iPhone app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace RigatoniStream.xcworkspace -scheme RigatoniStream -destination 'generic/platform=iOS Simulator' -derivedDataPath .build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee compile.log
      - name: Compile for physical iPhone
        run: |
          set -o pipefail
          xcodebuild build -workspace RigatoniStream.xcworkspace -scheme RigatoniStream -destination 'generic/platform=iOS' -derivedDataPath .build-device CODE_SIGNING_ALLOWED=NO | tee device-build.log
      - name: Run native unit tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'JSON.parse(STDIN.read)["devices"].values.flatten.each { |d| if d["name"].start_with?("iPhone"); puts d["udid"]; break; end }')
          test -n "$DEVICE_ID"
          bash fixtures/start.sh
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl keychain "$DEVICE_ID" add-root-cert fixtures/media/test-cert.pem
          export SIMCTL_CHILD_ANT_REQUIRE_FIXTURES=1
          export TEST_RUNNER_ANT_REQUIRE_FIXTURES=1
          xcodebuild test-without-building -workspace RigatoniStream.xcworkspace -scheme RigatoniStream -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath .build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee tests.log
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-reports
          path: |
            ios/compile.log
            ios/tests.log
            ios/device-build.log
            ios/.build/Logs/Test
            ios/Podfile.lock
