<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111116"><title>Rigatoni Stream</title><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rigatoni"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f8f7ff;background:#111116}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{padding:22px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px}.brand span{color:#a78bfa}.muted{color:#aaa9ba}.small{font-size:12px}.profile-page{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;padding:20px}.profiles{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.profile{background:none;border:0;color:white;display:flex;flex-direction:column;align-items:center;gap:10px}.avatar{height:92px;width:92px;border-radius:50%;display:grid;place-items:center;font-size:39px;background:linear-gradient(145deg,#4f46e5,#a855f7);border:2px solid #6d6384}.plus{background:#202029;font-size:46px}.shell{max-width:1050px;margin:auto;padding-bottom:90px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#1c1b25ed;backdrop-filter:blur(16px);border-top:1px solid #34313f;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:10}.tabs button{border:0;background:none;color:#aaa9ba;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}.tabs button.active{color:#c4b5fd}.tabs b{font-size:22px;font-weight:400}.hero{margin:10px 16px 25px;border-radius:20px;min-height:230px;padding:28px 22px;background:radial-gradient(circle at 85% 25%,#6e40a8,transparent 45%),linear-gradient(120deg,#27243c,#15151d);display:flex;flex-direction:column;justify-content:flex-end}.hero h1{font-size:32px;margin:0 0 8px}.cta{background:#a78bfa;color:#161020;border:0;padding:12px 18px;border-radius:12px;font-weight:750;width:max-content}.section{padding:0 16px;margin:26px 0}.section h2{font-size:21px}.cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.tile{flex:0 0 145px;height:185px;border-radius:14px;border:1px solid #393548;background:linear-gradient(145deg,#323047,#1a1923);color:#f9f7ff;display:flex;flex-direction:column;justify-content:end;text-align:left;padding:14px;font-weight:750}.tile:nth-child(2n){background:linear-gradient(145deg,#293e50,#1a1923)}.tile:nth-child(3n){background:linear-gradient(145deg,#533044,#1a1923)}.tile .emoji{font-size:48px;margin:auto}.rowitem{display:flex;justify-content:space-between;align-items:center;padding:17px;background:#22212b;border:1px solid #34313f;border-radius:14px;margin:9px 16px;gap:10px}.rowitem button,.outline{background:#343044;border:1px solid #554b6c;border-radius:10px;color:white;padding:10px 13px}.search{margin:8px 16px 20px;width:calc(100% - 32px);padding:14px;border:1px solid #403b50;border-radius:12px;background:#24222d;color:white}.heading{margin:20px 16px}.tag{color:#c4b5fd;font-size:12px}.notice{margin:16px;padding:15px;background:#252132;border:1px solid #554b6c;border-radius:12px;font-size:13px;color:#c8c3d5}.pill{padding:9px 14px;border-radius:20px;border:1px solid #514963;background:#262330;color:white;margin:4px}.modal{position:fixed;inset:0;background:#0e0e14ee;z-index:20;display:grid;place-items:center;padding:20px}.panel{width:min(100%,440px);padding:25px;border-radius:20px;background:#22202c}.panel input{display:block;width:100%;margin:12px 0;padding:13px;background:#14131b;color:white;border:1px solid #4b465b;border-radius:10px}.hidden{display:none!important}</style></head><body><div id="app"></div><script>
const storeKey='rigatoni-demo-v1';let state=JSON.parse(localStorage.getItem(storeKey)||'null')||{profiles:['Ant','Family'],current:null,tab:'Home',favorites:[],recent:[]};let search='';let modal=null;const save=()=>localStorage.setItem(storeKey,JSON.stringify(state));const items=[{id:'1',name:'Cinema One',icon:'🎬',type:'Live TV',genre:'Entertainment'},{id:'2',name:'World News',icon:'🌎',type:'Live TV',genre:'News'},{id:'3',name:'Sports Central',icon:'🏟️',type:'Live TV',genre:'Sports'},{id:'4',name:'Midnight City',icon:'🌃',type:'Movies',genre:'Thriller'},{id:'5',name:'The Last Voyage',icon:'🚀',type:'Movies',genre:'Sci-Fi'},{id:'6',name:'Summer Roads',icon:'🌄',type:'Movies',genre:'Drama'},{id:'7',name:'The Detectives',icon:'🕵️',type:'Series',genre:'Mystery'},{id:'8',name:'Kitchen Stories',icon:'🍝',type:'Series',genre:'Comedy'},{id:'9',name:'Wild Planet',icon:'🐆',type:'Series',genre:'Documentary'}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(t){state.tab=t;search='';save();render()}function choose(i){state.current=i;save();render()}function favorite(id){let f=state.favorites[state.current]||[];state.favorites[state.current]=f.includes(id)?f.filter(x=>x!==id):[...f,id];save();render()}function openItem(id){let it=items.find(x=>x.id===id);if(!it)return;state.recent[state.current]=[id,...(state.recent[state.current]||[]).filter(x=>x!==id)].slice(0,12);save();modal=id;render()}function closeModal(){modal=null;render()}function addProfile(){let n=prompt('Profile name (up to 20 characters)');if(n&&n.trim()){state.profiles.push(n.trim().slice(0,20));save();render()}}function cards(list){return '<div class="cards">'+list.map(i=>`<button class="tile" onclick="openItem('${i.id}')"><span class="emoji">${i.icon}</span><span>${esc(i.name)}</span><span class="muted small">${esc(i.genre)}</span></button>`).join('')+'</div>'}function section(title,list){return `<section class="section"><h2>${title}</h2>${cards(list)}</section>`}function content(){let t=state.tab;if(t==='Home')return `<div class="hero"><span class="tag">WELCOME BACK, ${esc(state.profiles[state.current]).toUpperCase()}</span><h1>Your world of entertainment.</h1><p class="muted">Live channels, movies and shows — all in one place.</p><button class="cta" onclick="go('Live TV')">Explore Live TV →</button></div>`+((state.recent[state.current]||[]).length?section('Continue Exploring',(state.recent[state.current]||[]).map(id=>items.find(x=>x.id===id)).filter(Boolean)):'')+section('Featured Movies',items.filter(x=>x.type==='Movies'))+section('Popular Series',items.filter(x=>x.type==='Series'))+section('Live Channels',items.filter(x=>x.type==='Live TV'));if(t==='Settings')return `<h1 class="heading">Settings</h1><div class="rowitem"><span>Current profile<br><small class="muted">${esc(state.profiles[state.current])}</small></span><button onclick="state.current=null;save();render()">Switch</button></div><div class="rowitem"><span>Playlist connections<br><small class="muted">Xtream Codes & M3U (coming in native app)</small></span><button onclick="alert('This is a design preview. IPTV credentials are not collected here.')">Info</button></div><div class="rowitem"><span>Appearance<br><small class="muted">Dark theme</small></span>🌙</div><div class="notice">Prototype only. No provider accounts, live streams, or copyrighted content are included.</div>`;let list=t==='Favorites'?items.filter(x=>(state.favorites[state.current]||[]).includes(x.id)):items.filter(x=>x.type===t);list=list.filter(x=>x.name.toLowerCase().includes(search.toLowerCase()));return `<h1 class="heading">${esc(t)}</h1><input class="search" placeholder="Search ${esc(t.toLowerCase())}..." value="${esc(search)}" oninput="search=this.value;document.getElementById('results').innerHTML=results()"><div id="results">${results(list)}</div>`}function results(list){let t=state.tab;list=list||((t==='Favorites'?items.filter(x=>(state.favorites[state.current]||[]).includes(x.id)):items.filter(x=>x.type===t)).filter(x=>x.name.toLowerCase().includes(search.toLowerCase())));return list.length?list.map(i=>`<div class="rowitem"><div><strong>${i.icon} ${esc(i.name)}</strong><br><small class="muted">${esc(i.genre)} · Demo</small></div><div style="display:flex;gap:6px"><button onclick="favorite('${i.id}')">${(state.favorites[state.current]||[]).includes(i.id)?'♥':'♡'}</button><button onclick="openItem('${i.id}')">View</button></div></div>`).join(''):'<p class="notice">Nothing here yet.</p>'}function render(){const app=document.getElementById('app');if(state.current===null){app.innerHTML=`<div class="profile-page"><div class="brand">🍝 Rigatoni <span>Stream</span></div><h1>Who's Watching?</h1><div class="profiles">${state.profiles.map((n,i)=>`<button class="profile" onclick="choose(${i})"><span class="avatar">${['😎','👨‍👩‍👧‍👦','🧑','👧','👦'][i%5]}</span>${esc(n)}</button>`).join('')}<button class="profile" onclick="addProfile()"><span class="avatar plus">+</span>Add Profile</button></div><p class="muted small">Interactive design preview · No live streams</p></div>`;return}const tabs=[['Home','⌂'],['Live TV','▣'],['Movies','▤'],['Series','▥'],['Favorites','♡'],['Settings','⚙']];app.innerHTML=`<div class="shell"><header><div class="brand">🍝 Rigatoni <span>Stream</span></div><button class="outline" onclick="state.current=null;save();render()">${esc(state.profiles[state.current])} ◉</button></header>${content()}</div><nav class="tabs">${tabs.map(([t,icon])=>`<button class="${state.tab===t?'active':''}" onclick="go('${t}')"><b>${icon}</b>${t}</button>`).join('')}</nav>${modal?`<div class="modal"><div class="panel"><button class="outline" onclick="closeModal()">← Back</button><h1>${esc(items.find(x=>x.id===modal).icon)} ${esc(items.find(x=>x.id===modal).name)}</h1><p class="muted">Demo title · Player integration coming soon.</p><button class="cta" onclick="favorite('${modal}');closeModal()">${(state.favorites[state.current]||[]).includes(modal)?'Remove Favorite':'♡ Add Favorite'}</button></div></div>`:''}`}render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
