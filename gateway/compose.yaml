services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SUPABASE_URL: https://edjejdftwjiasfhpffmc.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_w3-KHDqTcBEsLTRNwdRpgg_U9xugdH2
      MOVIES_PATH: /mnt/nas/media/movies
      TV_PATH: /mnt/nas/media/tv
      # Optional. Lets the web Home show "Trending this week". Kept on the Pi only.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Optional comma list of provider/EPG hosts (exact or *.suffix). Empty = any public host.
      IPTV_ALLOWED_HOSTS: ${IPTV_ALLOWED_HOSTS:-}
      # Concurrent live remux/transcode streams for the canvas and MPEG-TS engines.
      MAX_TRANSCODES: ${MAX_TRANSCODES:-2}
    volumes:
      - /mnt/nas/media/movies:/mnt/nas/media/movies:rw
      - /mnt/nas/media/tv:/mnt/nas/media/tv:rw
    tmpfs:
      - /tmp:size=192m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
