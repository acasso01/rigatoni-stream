<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Account · Ant Streams</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="theme.css"></head>
<body class="account-page"><main class="account-main"><a class="brand" href="./"><img src="icon-180.png" alt="" width="36" height="36"> ANT <b>STREAMS</b></a>
<section class="card" aria-labelledby="title"><div class="badge">YOUR PERSONAL STREAM</div><h1 id="title">Welcome back</h1><p id="description">Sign in to save your provider securely and keep your favorites with you.</p>
<form id="form"><div id="emailrow"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div>
<div id="passwordrow"><label for="password">Password</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><p class="password-hint hidden" id="passwordHint">Use at least 8 characters.</p></div>
<div id="confirmrow" class="hidden"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"></div><button class="button" id="submit" type="submit" disabled>Sign in</button></form>
<p class="status" id="status" role="status" aria-live="polite">Loading your account…</p><div class="links" id="links"><button class="text-button" id="forgot" type="button">Forgot password?</button><button class="text-button" id="signup" type="button">Create an account</button><button class="text-button hidden" id="back" type="button">Back to sign in</button><button class="text-button hidden" id="resend" type="button">Resend confirmation email</button></div>
<div id="signedin" class="hidden"><p id="identity"></p><a class="button" href="./xtream.html">Open Ant Streams →</a><button class="button secondary" id="signout" type="button">Sign out</button></div></section>
<a class="back-link" href="./">← Back to home</a><p class="note">Your account password and IPTV provider password are separate.</p><noscript><p class="status">Enable JavaScript to sign in or create an account.</p></noscript></main><script type="module" src="auth.js"></script></body></html>
