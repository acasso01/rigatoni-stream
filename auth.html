<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Account · Rigatoni Stream</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#6b111c77,transparent 55%),#09090b;color:#fafafa;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}main{width:100%;max-width:430px}.brand{text-align:center;font-weight:900;font-size:28px;letter-spacing:-1px;margin:0 0 28px}.brand b{color:#ed1c2e}.card{background:#17171b;border:1px solid #ffffff22;border-radius:16px;padding:28px;box-shadow:0 20px 60px #0008}h1{font-size:25px;margin:0 0 9px}p{color:#a1a1aa;line-height:1.5;font-size:14px}label{display:block;font-size:13px;margin:18px 0 7px;color:#d4d4d8}input{width:100%;padding:14px;border-radius:7px;background:#0c0c10;color:white;border:1px solid #52525b;font:inherit}button{width:100%;margin-top:20px;background:#e50914;color:white;border:0;border-radius:7px;padding:14px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}a{color:#ff8189}.links{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:18px}.links button{width:auto;padding:0;background:none;margin:0;color:#e4e4e7;font-size:13px;font-weight:500}.status{white-space:pre-wrap;overflow-wrap:anywhere;color:#e4e4e7}.hidden{display:none}.note{text-align:center;margin-top:22px;font-size:12px;color:#8c8c96}.badge{display:inline-block;color:#ff9aa2;font-size:11px;letter-spacing:2px;font-weight:800;margin-bottom:10px}
</style></head><body><main><div class="brand">🍝 RIGATONI <b>STREAM</b></div><section class="card"><div class="badge">PRIVATE ACCESS</div><h1 id="title">Welcome back</h1><p id="description">Sign in to your Rigatoni Stream account. Accounts are created by invitation only.</p>
<form id="form"><div id="emailrow"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div id="passwordrow"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div><button id="submit">Sign in</button></form>
<p class="status" id="status" role="status"></p><div class="links"><button id="forgot" type="button">Forgot password?</button><button id="back" type="button">Back to sign in</button></div>
<div id="signedin" class="hidden"><p id="identity"></p><button id="open" type="button">Open Rigatoni Stream →</button><button id="signout" type="button" style="background:#333">Sign out</button></div>
</section><p class="note">Invite-only access · Never share your IPTV provider password in an invitation.</p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const $=id=>document.getElementById(id);let mode='signin',client;
const status=t=>$('status').textContent=t;
function setMode(next){mode=next;$('form').classList.remove('hidden');$('signedin').classList.add('hidden');$('passwordrow').classList.toggle('hidden',next==='reset');$('password').required=next!=='reset';$('emailrow').classList.toggle('hidden',next==='password');$('email').required=next!=='password';$('title').textContent=next==='reset'?'Reset your password':next==='password'?'Choose a password':'Welcome back';$('description').textContent=next==='reset'?'We will email you a recovery link.':next==='password'?'Complete your invitation or password recovery.':'Sign in to your Rigatoni Stream account. Accounts are invitation-only.';$('submit').textContent=next==='reset'?'Send recovery email':next==='password'?'Save password':'Sign in';$('forgot').classList.toggle('hidden',next!=='signin');$('back').classList.toggle('hidden',next==='signin');status('')}
function showSession(session){if(!session)return;setMode('signin');$('form').classList.add('hidden');$('signedin').classList.remove('hidden');$('identity').textContent='Signed in as '+(session.user?.email||'your account');$('title').textContent='You’re signed in';$('description').textContent='Your account is ready. Provider credential syncing will be enabled after secure backend setup.'}
$('forgot').onclick=()=>setMode('reset');$('back').onclick=()=>setMode('signin');$('open').onclick=()=>location.assign('./xtream.html');$('signout').onclick=async()=>{await client.auth.signOut();setMode('signin')};
try{
if(!SUPABASE_URL||!SUPABASE_ANON_KEY||SUPABASE_URL.includes('YOUR_')||SUPABASE_ANON_KEY.includes('YOUR_'))throw Error('Account system needs Supabase configuration. See ACCOUNT_SETUP.md.');
client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const {data:{session}}=await client.auth.getSession();if(session)showSession(session);
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||event==='INVITE')setMode('password');else if(event==='SIGNED_IN'&&session&&mode!=='password')showSession(session);else if(event==='SIGNED_OUT')setMode('signin')});
const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='invite'||hash.get('type')==='recovery')setMode('password');
}catch(err){status(err.message);$('submit').disabled=true}
$('form').onsubmit=async e=>{e.preventDefault();if(!client)return;const btn=$('submit');btn.disabled=true;status('Please wait…');try{let result;if(mode==='signin')result=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});else if(mode==='reset')result=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin+location.pathname});else result=await client.auth.updateUser({password:$('password').value});if(result.error)throw result.error;if(mode==='reset')status('If that account exists, a recovery email has been sent.');else if(mode==='password'){status('Password saved. You can sign in now.');await client.auth.signOut();setMode('signin');status('Password saved. Please sign in.')}else showSession(result.data.session)}catch(err){status(err.message||'Unable to continue')}finally{btn.disabled=false}};
</script></body></html>
