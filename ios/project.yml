name: RigatoniStream
options:
  bundleIdPrefix: com.acasso01
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RigatoniStream:
    type: application
    platform: iOS
    sources: [RigatoniStream]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acasso01.rigatonistream
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ant Streams
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Ant Streams; VLCKit licensed under LGPL 2.1'
        INFOPLIST_KEY_NSSupportsLiveActivities: NO
        SWIFT_OBJC_BRIDGING_HEADER: RigatoniStream/RigatoniStream-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.3'
        CURRENT_PROJECT_VERSION: '5'
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RigatoniStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RigatoniStreamTests]
    dependencies:
      - target: RigatoniStream
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RigatoniStream:
    build:
      targets:
        RigatoniStream: all
    test:
      targets: [RigatoniStreamTests]
