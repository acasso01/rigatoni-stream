name: RigatoniStreamTV
# Generated project lives in tvos/; its Info.plist lives in Generated/.
options:
  bundleIdPrefix: com.acasso01
  deploymentTarget:
    tvOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RigatoniStreamTV:
    type: application
    platform: tvOS
    sources:
      # tvOS-only UI lives in tvos/RigatoniStreamTV/.
      - RigatoniStreamTV
      # Shared, additive-only reuse: these files live in ios/ and are NOT copied.
      # Shared local provider storage, networking, parsing and playback.
      - path: ../ios/RigatoniStream/DirectProviders.swift
      - path: ../ios/RigatoniStream/ProviderManagement.swift
      - path: ../ios/RigatoniStream/DirectPlayback.swift
      - path: ../ios/RigatoniStream/Core.swift
      - path: ../ios/RigatoniStream/Library.swift
      - path: ../ios/RigatoniStream/Discovery.swift
      - path: ../ios/RigatoniStream/Series.swift
      - path: ../ios/RigatoniStream/EPG.swift
      - path: ../ios/RigatoniStream/Saved.swift
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDisplayName: Ant Streams
        NSHumanReadableCopyright: Ant Streams; VLCKit licensed under LGPL 2.1
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.acasso01.rigatonistreamtv
        TARGETED_DEVICE_FAMILY: '3'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Ant Streams
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Ant Streams; VLCKit licensed under LGPL 2.1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '0.2.1'
        CURRENT_PROJECT_VERSION: '3'
  RigatoniStreamTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - ../ios/RigatoniStreamTests/VaultTests.swift
      - ../ios/RigatoniStreamTests/DirectConnectionTests.swift
    dependencies:
      - target: RigatoniStreamTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RigatoniStreamTV:
    build:
      targets:
        RigatoniStreamTV: all
    test:
      targets: [RigatoniStreamTVTests]
